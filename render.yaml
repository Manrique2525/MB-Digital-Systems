databases:
  - name: mb-digital-db
    plan: free

services:
  - type: web
    name: mb-digital-api
    runtime: docker
    plan: free
    branch: main
    rootDir: mb-digital-api
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: commit
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        fromService:
          name: mb-digital-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_URLS
        value: https://mb-digital-systems.netlify.app
      - key: CORS_SUPPORTS_CREDENTIALS
        value: "false"
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: mb-digital-db
          property: connectionString
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_DRIVER
        value: file
      - key: MAIL_MAILER
        value: log
      - key: SANCTUM_STATEFUL_DOMAINS
        value: localhost,mb-digital-systems.netlify.app
      - key: ADMIN_EMAIL
        value: contacto@mbdigitalsystems.com
      - key: WHATSAPP_NUMBER
        value: "529931782620"
